# Сборка десктопной Margy.
#
# Рецепт не выдуман: он списан с .github/workflows/linux.yml самого
# telegramdesktop, потому что официальный способ собрать их проект на линуксе
# — только через их же docker-образ, который собирает все зависимости, включая
# свою сборку Qt. На обычной машине это не выполнить, а на раннере — можно.
#
# Ключи никому не нужны: у них есть TDESKTOP_API_TEST с испытательными. Свои
# api_id и api_hash понадобятся только для сборки, которой будут пользоваться
# люди, и они лягут в секреты репозитория, а не в этот файл.

name: Десктоп

on:
  push:
    branches: [desktop]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      only_cache:
        description: 'Только собрать зависимости и сложить в кэш, без самой программы'
        type: boolean
        default: false

jobs:
  linux:
    name: Linux, отладочная
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: tdesktop:centos_env
      ONLY_CACHE: ${{ inputs.only_cache && 'true' || 'false' }}

    steps:
      - name: Забрать эту ветку.
        uses: actions/checkout@v5

      - name: Забрать tdesktop на записанном коммите.
        run: |
          # Имена переменных латиницей: bash кириллицу в именах не принимает
          # и молча падает с «command not found». Уже проверено на себе.
          pin=$(tr -d '[:space:]' < desktop/tdesktop.pin)
          echo "Собираем поверх tdesktop $pin"
          git clone https://github.com/telegramdesktop/tdesktop.git tdesktop
          cd tdesktop
          git checkout "$pin"
          git submodule update --init --recursive --depth 1

      - name: Наложить заплатки.
        run: |
          shopt -s nullglob
          patches=(desktop/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "Заплаток нет — собираем нетронутый tdesktop. Так и задумано:"
            echo "пока конвейер не собрал чистое дерево, любая поломка"
            echo "неотличима от «наша правка сломала»."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "== $p"
            git -C tdesktop apply --verbose "$GITHUB_WORKSPACE/$p"
          done

      - name: Поставить poetry и ccache, собрать Dockerfile.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
            | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd tdesktop/Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Освободить место.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Кэш зависимостей.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('desktop/tdesktop.pin') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Вернуть кэш сборки образа.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: tdesktop/Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Зависимости.
        uses: docker/build-push-action@v6
        with:
          context: tdesktop/Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Переложить кэш.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Вернуть кэш компилятора.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-

      - name: Собрать.
        if: env.ONLY_CACHE == 'false'
        working-directory: tdesktop
        run: |
          ccache -z
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
            -e CONFIG=Debug \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            $IMAGE_TAG \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Сохранить кэш компилятора.
        if: always() && steps.cache-tdesktop.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Проверить, что вышло.
        if: env.ONLY_CACHE == 'false'
        working-directory: tdesktop
        run: |
          out="out/Debug/Telegram"
          if [ -f "$out" ]; then
            echo "Собралось: $(stat -c %s "$out") байт"
          else
            echo "Сборка не дала файла"
            exit 1
          fi
