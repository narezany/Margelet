# Сборка десктопной Margy.
#
# Официальный способ собрать tdesktop на линуксе — только внутри их образа со
# всеми зависимостями, включая свою сборку Qt (docs/building-linux.md). На
# обычной машине это не выполнить, а на раннере — можно.
#
# Образ не собираем, а скачиваем готовый: телеграм публикует его сам, их же
# рабочим процессом docker.yml. Проверено — ghcr.io отдаёт манифест без
# всяких ключей, пятьдесят слоёв, гигабайт в сжатом виде. Своя сборка этого
# образа занимала часы и была первым кандидатом упереться в предел раннера.
#
# Если однажды окажется, что образ не подходит к записанному коммиту
# tdesktop (у них поменялось окружение, а мы стоим на старом), собрать его
# самим можно так, как это делают они: Telegram/build/docker/centos_env,
# poetry install, poetry run gen_dockerfile, docker build.
#
# Ключи никому не нужны: у них есть TDESKTOP_API_TEST с испытательными. Свои
# api_id и api_hash понадобятся только для сборки, которой будут
# пользоваться люди, и лягут в секреты репозитория, а не в этот файл.

name: Десктоп

on:
  push:
    branches: [desktop]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# Новый прогон отменяет предыдущий: держать два одинаковых смысла нет.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, отладочная
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/telegramdesktop/tdesktop/centos_env:latest

    steps:
      - name: Забрать эту ветку.
        uses: actions/checkout@v5

      - name: Забрать tdesktop на записанном коммите.
        run: |
          # Имена переменных латиницей: bash кириллицу в именах не принимает
          # и падает с «command not found». Уже проверено на себе.
          pin=$(tr -d '[:space:]' < desktop/tdesktop.pin)
          echo "Собираем поверх tdesktop $pin"
          git clone https://github.com/telegramdesktop/tdesktop.git tdesktop
          cd tdesktop
          git checkout "$pin"
          git submodule update --init --recursive --depth 1

      - name: Наложить заплатки.
        run: |
          shopt -s nullglob
          patches=(desktop/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "Заплаток нет — собираем нетронутый tdesktop. Так и задумано:"
            echo "пока конвейер не собрал чистое дерево, любая поломка"
            echo "неотличима от «наша правка сломала»."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "== $p"
            git -C tdesktop apply --verbose "$GITHUB_WORKSPACE/$p"
          done

      - name: Поставить ccache.
        run: |
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
            | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV

      - name: Освободить место.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Скачать сборочный образ.
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'образ: {{.Id}}, размер {{.Size}} байт'

      - name: Вернуть кэш компилятора.
        id: cache-tdesktop
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-

      - name: Собрать.
        working-directory: tdesktop
        run: |
          ccache -z
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
            -e CONFIG=Debug \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE" \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Сколько компилятор сделал заново.
        if: always()
        run: |
          ccache --print-stats | grep -E '^cache_(miss|hit_direct|hit_preprocessed)' || true

      - name: Сохранить кэш компилятора.
        if: always() && steps.cache-tdesktop.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Проверить, что вышло.
        working-directory: tdesktop
        run: |
          out="out/Debug/Telegram"
          if [ -f "$out" ]; then
            echo "Собралось: $(stat -c %s "$out") байт"
          else
            echo "Сборка не дала файла"
            exit 1
          fi
