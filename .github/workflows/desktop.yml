# Сборка десктопной Margy.
#
# Официальный способ собрать tdesktop на линуксе — только внутри их образа со
# всеми зависимостями, включая свою сборку Qt (docs/building-linux.md). На
# обычной машине это не выполнить, а на раннере — можно.
#
# Образ не собираем, а скачиваем готовый: телеграм публикует его сам, их же
# рабочим процессом docker.yml. Проверено — ghcr.io отдаёт манифест без
# всяких ключей, пятьдесят слоёв, гигабайт в сжатом виде. Своя сборка этого
# образа занимала часы и была первым кандидатом упереться в предел раннера.
#
# Если однажды окажется, что образ не подходит к записанному коммиту
# tdesktop (у них поменялось окружение, а мы стоим на старом), собрать его
# самим можно так, как это делают они: Telegram/build/docker/centos_env,
# poetry install, poetry run gen_dockerfile, docker build.
#
# Ключи никому не нужны: у них есть TDESKTOP_API_TEST с испытательными. Свои
# api_id и api_hash понадобятся только для сборки, которой будут
# пользоваться люди, и лягут в секреты репозитория, а не в этот файл.

name: Десктоп

on:
  push:
    branches: [desktop]
    paths:
      # Не 'desktop/**': правка плана не должна отменять идущую сборку и
      # занимать раннер. Запускаем от того, что на сборку влияет.
      - 'desktop/patches/**'
      - 'desktop/tdesktop.pin'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      config:
        description: 'Debug — быстрая проверка сборки; Release — то, что можно запускать'
        type: choice
        options: [Debug, Release]
        default: Debug

# Новый прогон отменяет предыдущий: держать два одинаковых смысла нет.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, отладочная
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/telegramdesktop/tdesktop/centos_env:latest
      CONFIG: ${{ inputs.config || 'Debug' }}

    steps:
      - name: Забрать эту ветку.
        uses: actions/checkout@v5

      - name: Забрать tdesktop на записанном коммите.
        run: |
          # Имена переменных латиницей: bash кириллицу в именах не принимает
          # и падает с «command not found». Уже проверено на себе.
          pin=$(tr -d '[:space:]' < desktop/tdesktop.pin)
          echo "Собираем поверх tdesktop $pin"
          git clone https://github.com/telegramdesktop/tdesktop.git tdesktop
          cd tdesktop
          git checkout "$pin"
          git submodule update --init --recursive --depth 1

      - name: Наложить заплатки.
        run: |
          shopt -s nullglob
          patches=(desktop/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "Заплаток нет — собираем нетронутый tdesktop. Так и задумано:"
            echo "пока конвейер не собрал чистое дерево, любая поломка"
            echo "неотличима от «наша правка сломала»."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "== $p"
            git -C tdesktop apply --verbose "$GITHUB_WORKSPACE/$p"
          done
          # Показываем, что дерево и правда изменилось. Шаг, который молча
          # ничего не наложил, выглядит в отчёте точно так же, как успешный.
          echo "-- что стало другим:"
          git -C tdesktop diff --stat

      - name: Поставить ccache.
        run: |
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
            | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV

      - name: Освободить место.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Скачать сборочный образ.
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'образ: {{.Id}}, размер {{.Size}} байт'

      - name: Вернуть кэш компилятора.
        id: cache-tdesktop
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # В ключе есть вид сборки: у Debug и Release разные объекты, и без
          # этого прогон восстанавливал чужой кэш и пересобирал всё заново —
          # восемь минут превращались в полтора часа.
          key: ${{ runner.OS }}-tdesktop-${{ env.CONFIG }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ env.CONFIG }}-

      - name: Собрать.
        working-directory: tdesktop
        # Имена секретов — те, что завёл владелец; TDESKTOP_* оставлены
        # запасными. Значения идут через окружение, а не подставляются прямо
        # в команду: так они не попадут ни в разбор строки, ни в эхо шага.
        env:
          API_ID: ${{ secrets.API_ID || secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.API_HASH || secrets.TDESKTOP_API_HASH }}
        run: |
          ccache -z
          # Ключи. Без своих api_id и api_hash телеграм пускает только в
          # испытательный контур: войти настоящим аккаунтом нельзя. Поэтому
          # для Debug берём их испытательные, а для Release — секреты
          # репозитория, если они там есть.
          if [ "$CONFIG" = "Release" ] && [ -n "$API_ID" ]; then
            KEYS="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
            echo "Собираем со своими ключами"
          else
            KEYS='-D TDESKTOP_API_TEST=ON'
            echo "Собираем с испытательными ключами: настоящим аккаунтом войти будет нельзя"
          fi
          # Отладочную собираем без оптимизации — так быстрее, а смотреть на
          # неё всё равно только компилятору. Для Release это было бы вредно.
          FLAGS=""
          if [ "$CONFIG" = "Debug" ]; then
            FLAGS='-D CMAKE_C_FLAGS_DEBUG=-O0 -D CMAKE_CXX_FLAGS_DEBUG=-O0'
          fi
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
            -e CONFIG="$CONFIG" \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE" \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES="$CONFIG" \
            $KEYS $FLAGS \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Сколько компилятор сделал заново.
        if: always()
        run: |
          ccache --print-stats | grep -E '^cache_(miss|hit_direct|hit_preprocessed)' || true

      - name: Сохранить кэш компилятора.
        if: always() && steps.cache-tdesktop.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Проверить, что вышло.
        working-directory: tdesktop
        run: |
          out="out/$CONFIG/Telegram"
          if [ ! -f "$out" ]; then
            echo "Сборка не дала файла"
            exit 1
          fi
          echo "Собралось: $(stat -c %s "$out") байт"
          # Имя внутри самого файла. Размер тут не показатель: он совпал с
          # несобранным-непропатченным до байта, потому что строка короче,
          # а выравнивание съедает разницу. Значит смотрим не на размер.
          if strings -a "$out" | grep -qx "Margy"; then
            echo "Внутри файла есть Margy — заплатка доехала до двоичного кода"
          else
            echo "Заплатка не доехала: в файле нет строки Margy"
            exit 1
          fi

      - name: Отдать готовое.
        if: env.CONFIG == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: margy-linux
          path: tdesktop/out/Release/Telegram
          if-no-files-found: error
